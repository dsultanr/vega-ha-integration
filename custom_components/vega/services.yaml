read_sensors:
  name: Прочитать выбранные датчики
  description: Адресный pull через существующее соединение Vega. Возвращает значения, время запросов и ответов, ошибки. Не запускает автомобиль и не меняет настройки. Время ответа не доказывает свежесть исходного CAN-значения. До 16 датчиков, до 30 секунд на пакет.
  fields:
    entry_id:
      name: Интеграция Vega
      selector:
        text:
    sensor_ids:
      name: Номера датчиков
      description: По умолчанию — скорость, удалённый режим, зажигание, Auto, температура климата, вентилятор, передние сиденья, заднее правое сиденье, руль, направление обдува и температура салона.
      example: [2801, 2805, 2806, 2905, 2906, 2907, 2912, 2913, 2918, 2902, 2924, 2925]
      selector:
        object:
    timeout:
      name: Таймаут одного датчика
      default: 2
      selector:
        number:
          min: 0.5
          max: 6
          step: 0.5
          unit_of_measurement: s
prepare_hv_battery:
  name: Проверить настройки мощности ВВБ
  description: Прочитать CAN и ISO-TP, проверить совместимость и свободные слоты. Возвращает план настройки; ничего не записывает.
  fields:
    entry_id:
      name: Интеграция Vega
      description: Обязательно, если настроено несколько трекеров.
      selector:
        text:
    profile:
      name: Профиль автомобиля
      required: true
      selector:
        select:
          options:
            - value: f515_ispace_4wd
              label: F515 / i-Space 4WD
            - value: ispace_2025
              label: i-Space 2025 (не проверено на автомобиле)

configure_hv_battery:
  name: Настроить измерение мощности ВВБ
  description: Перепроверить план, сохранить резервную копию, записать датчики и период передачи с обратным чтением. Нужен Direct Control. План действует 15 минут и применяется один раз.
  fields:
    entry_id:
      name: Интеграция Vega
      description: Обязательно, если настроено несколько трекеров.
      selector:
        text:
    plan_id:
      name: План настройки
      description: plan_id из ответа prepare_hv_battery для этого трекера.
      required: true
      selector:
        text:

read_can_scripts:
  name: Read CAN scripts
  description: >-
    Read the tracker's Setting 5502 CAN-script slots into the integration and
    config/vega/can_scripts_<imei>.json. Read Setting 4001 scenarios to determine
    command-to-slot bindings. Does not run scripts or change tracker settings.
  fields:
    entry_id:
      name: Integration entry ID
      description: Required when more than one Vega integration is loaded.
      selector:
        text:

write_can_script:
  name: Write CAN script
  description: >-
    Validate, back up and write a CAN script, then read back and compare all 82
    bytes. Success means the stored bytes match; it does not run the script.
    Requires Direct Control. Returns verified=true when a response is requested.
  fields:
    slot:
      name: Slot
      description: Setting 5502 sub-id (slot index).
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    script:
      name: Script
      description: >-
        {"name": "...", "repeat": 1, "frames": [{"delay_ms": 2000, "can_id": 916,
        "bus": 2, "data": "fcff0fff001ff000"}, ...]}
      required: true
      selector:
        object:
    entry_id:
      name: Integration entry ID
      description: Required when more than one Vega integration is loaded.
      selector:
        text:
    expected_raw:
      name: Original slot bytes
      description: Optional original 82 bytes in HEX; reject the write if the slot has changed.
      selector:
        text:

read_commands:
  name: Read commands and scenarios
  description: Read eight CAN slots and 25 scenarios, including conditions and external output actions, into the CAN Scripts sensor attributes.
  fields:
    entry_id:
      name: Integration entry ID
      description: Required when more than one Vega integration is loaded.
      selector:
        text:

write_commands:
  name: Save commands and scenarios
  description: >-
    Validate and back up a document containing scenarios and scripts. Check the
    original snapshots, write changed CAN slots followed by scenarios, and verify
    each by reading it back. Requires Direct Control. On failure reports confirmed
    writes and stops. Does not send a separate command to execute the scenario.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:
    document:
      name: Command document
      description: Object containing scenarios (index, conditions, match, actions) and scripts (slot, name, repeat, frames).
      required: true
      selector:
        object:
    expected:
      name: Original settings
      description: Map of 4001/index and 5502/slot to original HEX bytes, including referenced CAN slots. The editor supplies this automatically.
      required: true
      selector:
        object:

read_server_slots:
  name: Read server slots
  description: Read the four tracker server destinations (Setting 3001). Does not change settings or expose PINs.
  fields:
    entry_id:
      name: Integration entry ID
      selector:
        text:

set_server_address:
  name: Change one server address
  description: Changes only the address, preserving protocol and period. Requires a matching current address and direct control. Read slots afterwards to verify.
  fields:
    entry_id:
      selector:
        text:
    slot:
      required: true
      selector:
        number:
          min: 1
          max: 4
          mode: box
    address:
      required: true
      selector:
        text:
    expected_address:
      required: true
      selector:
        text:

relay_status:
  name: Cloud relay status
  description: Current cloudru connection, tracker slots, cloud upstreams and capture health.
  fields:
    entry_id:
      selector:
        text:

check_climate_profile:
  name: Проверить профиль для редактора климата
  description: Прочитать CAN-декодеры трекера и сравнить их с проверенным автомобилем. Только чтение. Форма «Климатический профиль» доступна лишь после успешной проверки.
  fields:
    entry_id:
      name: Интеграция Vega
      description: Обязательно, если настроено несколько трекеров.
      selector:
        text:
    profile:
      name: Профиль автомобиля
      required: true
      selector:
        select:
          options:
            - value: f515_ispace_4wd
              label: F515 / i-Space 4WD

backup_commands:
  name: Сохранить резервную копию сценариев
  description: Прочитать из трекера все 25 сценариев и 8 CAN-слотов и сохранить их в /config/vega/command_snapshots_<IMEI>/. Трекер не изменяется.
  fields:
    entry_id:
      name: Интеграция Vega
      description: Обязательно, если настроено несколько трекеров.
      selector:
        text:
    note:
      name: Примечание
      description: Необязательная подпись копии, до 120 символов.
      selector:
        text:

list_command_backups:
  name: Список резервных копий сценариев
  description: Вернуть сохранённые резервные копии сценариев и CAN-слотов, новые сверху.
  fields:
    entry_id:
      name: Интеграция Vega
      description: Обязательно, если настроено несколько трекеров.
      selector:
        text:

restore_commands:
  name: Восстановить сценарии из резервной копии
  description: Записать в трекер отличающиеся сценарии и CAN-слоты из выбранной копии с проверкой обратным чтением. Текущее состояние перед записью сохраняется отдельной копией. Нужен Direct Control. Команды автомобилю не отправляются.
  fields:
    entry_id:
      name: Интеграция Vega
      description: Обязательно, если настроено несколько трекеров.
      selector:
        text:
    backup_id:
      name: Резервная копия
      description: backup_id из ответа backup_commands или list_command_backups.
      required: true
      selector:
        text:
